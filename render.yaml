services:
  - type: web
    name: parkxigo-backend
    env: node
    buildCommand: |
      npm install
      cd backend
      npm run build
      ls -la dist/
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false 