services:
  - type: web
    name: parkxigo-backend
    env: node
    buildCommand: |
      npm install
      cd backend
      echo "Trying TypeScript build..."
      npm run build || echo "TypeScript build failed, using fallback server"
      mkdir -p dist
      cp ../backend/dist-server.js dist/server.js
      ls -la dist/
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false 