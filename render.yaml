services:
  - type: web
    name: parkxigo-backend
    env: node
    buildCommand: |
      npm install
      cp backend/dist-server.js server.js
      ls -la
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: MONGODB_URI
        sync: false 